<script>
    let configEmpresaGlobal = null;

    setTimeout(function() {
        ventas_CargarConfiguracionInicial();
        // La sincronización visual de la tarjeta PRO/Estándar la maneja
        // exclusivamente ModConfig_Subscriptions.html (seleccionarModoSistema),
        // que ya se auto-inicializa solo. Aquí no la duplicamos.

        // Pinta el boton activo del NAV de Configuracion especificamente --
        // no el primer .menu-btn.active de la pagina (que podria ser de otro modulo).
        const botonTabSuscripciones = document.getElementById('config-tab-suscripciones');
        if (botonTabSuscripciones) {
            botonTabSuscripciones.style.background = 'var(--accent)';
            botonTabSuscripciones.style.color = 'white';
            botonTabSuscripciones.style.fontWeight = '600';
        }
    }, 400);

    function showPanel_Config(panelId, btn) {
        // Solo oculta los paneles de Configuracion -- no todos los
        // .content-area de la pagina (que incluirian paneles de otros modulos).
        ['panel-suscripciones', 'panel-empresa', 'panel-productos', 'panel-usuarios'].forEach(id => {
            const p = document.getElementById(id);
            if (p) p.style.display = 'none';
        });

        // Solo resetea los botones del nav de Configuracion -- no todos los
        // .menu-btn de la pagina (que incluirian los de ModAlmacen, etc.).
        document.querySelectorAll('.nav-buttons .menu-btn').forEach(b => {
            if (b.closest('nav') === btn.closest('nav')) {
                b.style.background = '#e2e8f0';
                b.style.color = 'var(--text)';
                b.style.fontWeight = '500';
            }
        });
        
        const target = document.getElementById(panelId);
        if(panelId === 'panel-productos') {
            target.style.display = 'flex';
        } else {
            if (target) target.style.display = 'block';
        }
        
        btn.style.background = 'var(--accent)';
        btn.style.color = 'white';
        btn.style.fontWeight = '600';
    }

    /**
     * Fuerza la pestana "Suscripciones" visualmente activa, sin necesitar un
     * boton DOM real -- se llama desde Index.html cada vez que se entra a
     * esta vista, para que nunca quede en blanco si el shell ya estaba
     * cargado en memoria de una visita anterior en la misma sesion (mismo
     * patron ya usado en Compras y en el shell de Almacen).
     */
    window.config_ForzarPanelSuscripciones = function() {
        const botonSuscripciones = document.getElementById('config-tab-suscripciones');
        if (botonSuscripciones) showPanel_Config('panel-suscripciones', botonSuscripciones);
    };

    function toggleProduccion() {
        const tipo = document.getElementById('config-tipo').value;
        const seccion = document.getElementById('seccion-produccion');
        seccion.style.display = (tipo === 'Produccion') ? 'block' : 'none';
        
        const lista = document.getElementById('lista-etapas');
        if (tipo === 'Produccion' && lista.children.length === 0) addEtapa();
    }

    let stepCount = 0;
    function addEtapa() {
        stepCount++;
        const lista = document.getElementById('lista-etapas');
        const div = document.createElement('div');
        div.style.display = 'flex';
        div.style.gap = '8px';
        div.style.marginBottom = '8px';
        div.style.alignItems = 'center';
        div.style.boxSizing = 'border-box';
        div.innerHTML = `
            <span style="background: var(--accent); color: white; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; flex-shrink: 0;">${stepCount}</span>
            <input type="text" class="form-control-erp" style="height:34px; padding: 6px 10px; font-size: 13px;" placeholder="Ej: Fase de pulido">
            <i class="fa-solid fa-trash-can" onclick="this.parentElement.remove();" style="color:#ef4444; cursor:pointer; font-size: 13px; margin-left: 5px; transition: color 0.2s;"></i>
        `;
        lista.appendChild(div);
    }

    function guardarSimulado() {
        alert("Configuración y estructura guardadas con éxito en la interfaz.");
    }

    // ========================================================
    //   DETECCIÓN Y CONVERSIÓN DE IMAGEN (Logo de Plataforma)
    // ========================================================
    function config_ProcesarYPrevisualizarLogo(input) {
        const file = input.files[0];
        const lblName = document.getElementById('config-txt-file-name');
        const inputOculto = document.getElementById('config-empresa-logo');
        const wrapperPreview = document.getElementById('config-wrapper-preview');
        const imgPreview = document.getElementById('config-img-preview');

        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
            alert("El archivo supera los 2MB. Selecciona una imagen más pequeña para garantizar la velocidad del sistema.");
            input.value = "";
            return;
        }

        if (lblName) lblName.innerText = file.name;

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64String = e.target.result;
            if (inputOculto) inputOculto.value = base64String;
            if (imgPreview) imgPreview.src = base64String;
            if (wrapperPreview) wrapperPreview.style.display = "block";
        };
        reader.readAsDataURL(file);
    }

    function config_RemoverLogoCargado() {
        const inputFileInput = document.getElementById('config-empresa-file');
        const lblName = document.getElementById('config-txt-file-name');
        const inputOculto = document.getElementById('config-empresa-logo');
        const wrapperPreview = document.getElementById('config-wrapper-preview');
        const imgPreview = document.getElementById('config-img-preview');

        if (inputFileInput) inputFileInput.value = "";
        if (lblName) lblName.innerText = "Ningún archivo seleccionado";
        if (inputOculto) inputOculto.value = "";
        if (imgPreview) imgPreview.src = "";
        if (wrapperPreview) wrapperPreview.style.display = "none";
    }

    // ========================================================
    //   CARGA DE CONFIGURACIÓN EMPRESA AL INICIAR
    // ========================================================
    function ventas_CargarConfiguracionInicial() {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(function(datos) {
                if (datos) {
                    configEmpresaGlobal = datos;
                    if(document.getElementById('config-empresa-nombre')) document.getElementById('config-empresa-nombre').value = datos.nombreEmpresa || '';
                    if(document.getElementById('config-empresa-nit')) document.getElementById('config-empresa-nit').value = datos.nit || '';
                    if(document.getElementById('config-empresa-nrc')) document.getElementById('config-empresa-nrc').value = datos.nrc || '';
                    
                    if(document.getElementById('config-empresa-logo')) {
                        const valorLogo = datos.logoUrl || '';
                        document.getElementById('config-empresa-logo').value = valorLogo;
                        
                        if (valorLogo && valorLogo.startsWith('data:image')) {
                            if(document.getElementById('config-img-preview')) document.getElementById('config-img-preview').src = valorLogo;
                            if(document.getElementById('config-wrapper-preview')) document.getElementById('config-wrapper-preview').style.display = "block";
                            if(document.getElementById('config-txt-file-name')) document.getElementById('config-txt-file-name').innerText = "Imagen Corporativa Activa";
                        }
                    }

                    if(document.getElementById('config-empresa-giro')) document.getElementById('config-empresa-giro').value = datos.giroComercial || '';
                    if(document.getElementById('config-sistema-nombre-erp')) document.getElementById('config-sistema-nombre-erp').value = datos.nombreErp || '';
                    if(document.getElementById('config-empresa-direccion')) document.getElementById('config-empresa-direccion').value = datos.direccion || '';
                    if(document.getElementById('config-empresa-telefono')) document.getElementById('config-empresa-telefono').value = datos.telefono || '';
                    if(document.getElementById('config-empresa-correo')) document.getElementById('config-empresa-correo').value = datos.correo || '';

                    // Campos extendidos (régimen / ubicación DTE / etc.)
                    if(document.getElementById('config-empresa-regimen') && datos.regimen) document.getElementById('config-empresa-regimen').value = datos.regimen;
                    if(document.getElementById('config-empresa-clasificacion') && datos.clasificacion) document.getElementById('config-empresa-clasificacion').value = datos.clasificacion;
                    if(document.getElementById('config-empresa-ciiu') && datos.ciiu) document.getElementById('config-empresa-ciiu').value = datos.ciiu;
                    if(document.getElementById('config-finanzas-monedasec') && datos.monedaSecundaria) document.getElementById('config-finanzas-monedasec').value = datos.monedaSecundaria;
                    if(document.getElementById('config-finanzas-iva') && datos.tasaIva) document.getElementById('config-finanzas-iva').value = datos.tasaIva;
                    if(document.getElementById('config-hacienda-ambiente') && datos.ambienteHacienda) document.getElementById('config-hacienda-ambiente').value = datos.ambienteHacienda;

                    if (typeof toggleSeccionesHacienda === 'function') toggleSeccionesHacienda();

                    ventas_AplicarIdentidadVisual(datos);
                }
            }).obtenerConfiguracionEmpresaServidor();
        }
    }

    function guardarConfiguracionEmpresaReal() {
        const datosPayload = {
            nombreEmpresa: document.getElementById('config-empresa-nombre') ? document.getElementById('config-empresa-nombre').value.trim() : '',
            nit: document.getElementById('config-empresa-nit') ? document.getElementById('config-empresa-nit').value.trim() : '',
            nrc: document.getElementById('config-empresa-nrc') ? document.getElementById('config-empresa-nrc').value.trim() : '',
            logoUrl: document.getElementById('config-empresa-logo') ? document.getElementById('config-empresa-logo').value.trim() : '',
            giroComercial: document.getElementById('config-empresa-giro') ? document.getElementById('config-empresa-giro').value.trim() : '',
            nombreErp: document.getElementById('config-sistema-nombre-erp') ? document.getElementById('config-sistema-nombre-erp').value.trim() : 'Mi ERP',
            direccion: document.getElementById('config-empresa-direccion') ? document.getElementById('config-empresa-direccion').value.trim() : '',
            telefono: document.getElementById('config-empresa-telefono') ? document.getElementById('config-empresa-telefono').value.trim() : '',
            correo: document.getElementById('config-empresa-correo') ? document.getElementById('config-empresa-correo').value.trim() : '',

            // Campos extendidos del formulario de ModConfig_Empresa
            regimen: document.getElementById('config-empresa-regimen') ? document.getElementById('config-empresa-regimen').value : 'INFORMAL',
            clasificacion: document.getElementById('config-empresa-clasificacion') ? document.getElementById('config-empresa-clasificacion').value : 'Otros',
            ciiu: document.getElementById('config-empresa-ciiu') ? document.getElementById('config-empresa-ciiu').value : '',
            depto: document.getElementById('config-ubicacion-depto') ? document.getElementById('config-ubicacion-depto').value : '',
            municipio: document.getElementById('config-ubicacion-muni') ? document.getElementById('config-ubicacion-muni').value : '',
            distrito: document.getElementById('config-ubicacion-distrito') ? document.getElementById('config-ubicacion-distrito').value : '',
            ambienteHacienda: document.getElementById('config-hacienda-ambiente') ? document.getElementById('config-hacienda-ambiente').value : '00',
            logoDte: document.getElementById('config-empresa-logo-dte') ? document.getElementById('config-empresa-logo-dte').value.trim() : '',
            monedaSecundaria: document.getElementById('config-finanzas-monedasec') ? document.getElementById('config-finanzas-monedasec').value : 'NINGUNA',
            tasaIva: document.getElementById('config-finanzas-iva') ? document.getElementById('config-finanzas-iva').value : 13
        };

        if (!datosPayload.nombreEmpresa || !datosPayload.nombreErp) {
            alert("Por favor, introduce al menos la Razón Social y el Nombre del ERP.");
            return;
        }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            const btnSubmit = document.querySelector("#form-config-empresa .btn-submit");
            let txtOriginal = "";
            if (btnSubmit) {
                txtOriginal = btnSubmit.innerHTML;
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sincronizando...';
            }

            google.script.run
                .withSuccessHandler(function(res) {
                    if(btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerHTML = txtOriginal; }
                    if (res.exito) {
                        alert("¡Perfil Corporativo guardado y sincronizado con éxito!");
                        ventas_AplicarIdentidadVisual(datosPayload);
                    } else {
                        alert("Error interno: " + res.error);
                    }
                })
                .withFailureHandler(function(err) {
                    if(btnSubmit) { btnSubmit.disabled = false; btnSubmit.innerHTML = txtOriginal; }
                    alert("Error en la conexión con la base de datos: " + err);
                })
                .guardarConfiguracionEmpresaServidor(datosPayload);
        } else {
            alert("Simulación Local: Datos listos para la nube (" + datosPayload.nombreErp + ")");
            ventas_AplicarIdentidadVisual(datosPayload);
        }
    }

    function ventas_AplicarIdentidadVisual(datos) {
        if (!datos) return;
        document.title = datos.nombreErp;
        const tituloGlobal = document.getElementById('erp-titulo-global');
        if (tituloGlobal) {
            if (datos.logoUrl && datos.logoUrl.startsWith('data:image')) {
                tituloGlobal.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <img src="${datos.logoUrl}" alt="Logo" style="max-height: 28px; max-width: 35px; object-fit: contain; border-radius: 4px; flex-shrink: 0;">
                        <div style="display: flex; flex-direction: column;">
                            <span style="font-weight: 700; color: white; line-height: 1.2;">${datos.nombreErp}</span>
                            ${datos.giroComercial ? `<span style="font-size: 10px; color: #94a3b8; font-weight: 500; line-height: 1.2; margin-top: 2px;">${datos.giroComercial}</span>` : ''}
                        </div>
                    </div>
                `;
                tituloGlobal.style.display = "block";
            } else {
                tituloGlobal.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <i class="fa-solid fa-monument" style="color: #60a5fa;"></i>
                        <div style="display: flex; flex-direction: column;">
                            <span style="font-weight: 700; color: white; line-height: 1.2;">${datos.nombreErp}</span>
                            ${datos.giroComercial ? `<span style="font-size: 10px; color: #94a3b8; font-weight: 500; line-height: 1.2; margin-top: 2px;">${datos.giroComercial}</span>` : ''}
                        </div>
                    </div>
                `;
                tituloGlobal.style.display = "block";
            }
        }
    }
</script>
